# OBB Setter Floor Dashboard: intake. Single source of truth. Fill every TODO.
# Everything on the board derives from this file plus the three config/*.json files.

client:
  company: "Online Business Builders"
  short: "OBB"
  vertical: "B2B operations for home-care agencies: outbound SDR calling, lead qualification, appointment booking"
  crm: "SID"                          # SID is OBB's GoHighLevel instance
  crm_platform: "GHL"
  crm_location_id: "6nyOgOLPgBOHWJRtt3jQ"
  api_token_env: "SID_TOKEN"          # env var only, never in the repo
  hipaa_mode: true                    # SID is on the HIPAA-upgraded GHL plan. See docs/compliance.md

engine:
  scope: "fulfillment"                # v1 = what OBB DELIVERS (setter floor). Front-end is v2.
  _note: >
    OBB runs two engines. (1) Front-End / Growth = OBB acquiring its own clients.
    (2) Fulfillment / Product-Service = per-client Facebook lead forms plus the SID setter floor
    booking appointments. This board is engine 2. Do not mix the two on one view.

