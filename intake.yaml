  hours: "10:00-22:00"                # SDR floor, local. Drives the monitor agent and SLA clock
  days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]   # 7 days/week
  setters:                            # CURRENT SDR floor (confirmed). See ghl-config.json > activeSetters
    - name: "Sophia"
      role: "SDR"
      start_date: "TODO"
