<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 770" role="img" aria-label="OBB Biz Builders">
  <defs>
    <linearGradient id="obbRing" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3E6FB5"/><stop offset="1" stop-color="#4F9BE0"/>
    </linearGradient>
    <linearGradient id="obbB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FBF"/><stop offset="1" stop-color="#38B4EA"/>
    </linearGradient>
  </defs>

  <!-- O -->
  <circle cx="196" cy="300" r="163" fill="none" stroke="url(#obbRing)" stroke-width="41"/>

  <!-- Two B glyphs. Each bowl is a stadium (flat left edge, semicircular right end) with a
       triangular chevron bitten out of the left, so the counter reads as an arrow pointing right. -->
  <g fill="url(#obbB)">
    <g id="obb-b">
      <path d="M436 24 h250 a132 132 0 0 1 0 264 h-250 l86 -132 z
               M436 24 l86 132 h108 a53 53 0 0 0 0 -106 h-108 z" fill-rule="evenodd"/>
      <path d="M436 312 h250 a132 132 0 0 1 0 264 h-250 l86 -132 z
               M436 312 l86 132 h108 a53 53 0 0 0 0 -106 h-108 z" fill-rule="evenodd"/>
    </g>
    <use href="#obb-b" x="318"/>
  </g>

  <text x="1162" y="740" text-anchor="end" fill="#35AEE6"
        font-family="Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
        font-size="104" font-weight="700" letter-spacing="14">BIZ BUILDERS</text>
</svg>
