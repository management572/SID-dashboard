# SID pipeline: pull SID (GoHighLevel) and rebuild the board data, on a schedule and on demand.
#
# This runs on GitHub's infrastructure, which CAN reach the GoHighLevel API (the Claude session
# could not, due to an egress policy). The floor's live numbers refresh here with no local step.
#
# ONE-TIME SETUP (the only manual action needed):
#   Repo Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  SID_TOKEN
#     Value: your GoHighLevel private integration token (the pit-... value)
#   Optional later: SLACK_WEBHOOK_URL, DIALER_TOKEN.
#
# The token lives only in this secret. It is never written to the repo and never printed in a log.
#
# Modes (workflow_dispatch input "mode"):
#   discover  read-only inventory of the location -> commits config/sid-discovery.json so the TODO
#             field IDs in config/ghl-config.json can be filled. Run this FIRST.
#   refresh   pull + build -> commits data/dashboard-data.json (aggregate, no PHI). The scheduled run.
#
# Scheduled runs fire only from the repository default branch, so they start once this branch is
# merged. Until then, run either mode by hand: Actions tab -> SID pipeline -> Run workflow.

name: SID pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover (inventory IDs) or refresh (pull + build)"
        type: choice
        options: [refresh, discover]
        default: refresh
  schedule:
    # Every 30 minutes. Narrow to floor hours once the timezone is confirmed.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: sid-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require the SID token
        env:
          SID_TOKEN: ${{ secrets.SID_TOKEN }}
        run: |
          if [ -z "$SID_TOKEN" ]; then
            echo "::error::SID_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            echo "See the header of .github/workflows/sid-pipeline.yml for the exact steps."
            exit 1
          fi
          echo "SID_TOKEN is present (value hidden)."

      - name: Discover SID inventory (read only)
        if: ${{ github.event.inputs.mode == 'discover' }}
        env:
          SID_TOKEN: ${{ secrets.SID_TOKEN }}
        run: python pipeline/discover_sid.py

      - name: Pull SID and build board data
        if: ${{ github.event.inputs.mode != 'discover' }}
        env:
          SID_TOKEN: ${{ secrets.SID_TOKEN }}
        run: |
          python pipeline/fetch_sid.py
          python pipeline/build_data.py

      - name: Commit results
        run: |
          git config user.name  "sid-pipeline[bot]"
          git config user.email "sid-pipeline@users.noreply.github.com"
          if [ "${{ github.event.inputs.mode }}" = "discover" ]; then
            git add -f config/sid-discovery.json || true
          else
            # data/dashboard-data.json is gitignored to prevent accidental local commits;
            # force-add the generated aggregate file (no PHI) so the board always has fresh data.
            git add -f data/dashboard-data.json || true
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): automated SID ${{ github.event.inputs.mode || 'refresh' }} [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
